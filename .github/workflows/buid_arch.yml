name: Build with architecture

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release label/tag; non-promoting builds use an isolated run-specific draft tag'
        required: false
        default: 'preview'
        type: string
      publish_enabled:
        description: 'Enable S3 staging? Stable All builds also publish GitHub and promote latest.'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'
      build_os:
        description: 'Build OS'
        required: true
        default: 'All'
        type: choice
        options:
          - windows-latest-x64-zip
          - windows-latest-x64-7z
          - windows-latest-x64-nsis
          - windows-11-arm-arm64-zip
          - windows-11-arm-arm64-7z
          - windows-11-arm-arm64-nsis
          - macos-15-intel-x64-dmg
          - macos-latest-arm64-dmg
          - ubuntu-latest-x64-AppImage
          - ubuntu-latest-x64-deb
          - ubuntu-latest-x64-snap
          - ubuntu-latest-x64-rpm
          - ubuntu-24.04-arm-arm64-AppImage
          - ubuntu-24.04-arm-arm64-deb
          - ubuntu-24.04-arm-arm64-rpm
          - All
permissions:
  contents: write

env:
  ELECTRON_OUTPUT_PATH: ./dist_electron
  CSC_LINK: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
  CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
  USE_HARD_LINKS: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            format: zip
            filter: windows-latest-x64-zip
          - os: windows-latest
            arch: x64
            format: 7z
            filter: windows-latest-x64-7z
          - os: windows-latest
            arch: x64
            format: nsis
            filter: windows-latest-x64-nsis
          - os: windows-11-arm
            arch: arm64
            format: zip
            filter: windows-11-arm-arm64-zip
          - os: windows-11-arm
            arch: arm64
            format: 7z
            filter: windows-11-arm-arm64-7z
          - os: windows-11-arm
            arch: arm64
            format: nsis
            filter: windows-11-arm-arm64-nsis
          - os: macos-15-intel
            arch: x64
            format: dmg
            filter: macos-15-intel-x64-dmg
          - os: macos-latest
            arch: arm64
            format: dmg
            filter: macos-latest-arm64-dmg
          - os: ubuntu-latest
            arch: x64
            format: AppImage
            filter: ubuntu-latest-x64-AppImage
          - os: ubuntu-latest
            arch: x64
            format: deb
            filter: ubuntu-latest-x64-deb
          - os: ubuntu-latest
            arch: x64
            format: snap
            filter: ubuntu-latest-x64-snap
          - os: ubuntu-latest
            arch: x64
            format: rpm
            filter: ubuntu-latest-x64-rpm
          - os: ubuntu-24.04-arm
            arch: arm64
            format: AppImage
            filter: ubuntu-24.04-arm-arm64-AppImage
          - os: ubuntu-24.04-arm
            arch: arm64
            format: deb
            filter: ubuntu-24.04-arm-arm64-deb
          - os: ubuntu-24.04-arm
            arch: arm64
            format: rpm
            filter: ubuntu-24.04-arm-arm64-rpm
    name: Build on ${{ matrix.os }} for ${{ matrix.arch }} - ${{ matrix.format }}
    steps:
      - name: Set up git config
        run: |
          git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      # step2: sign
      - name: Install the Apple certificates
        if: contains(matrix.os, 'macos') && (github.event.inputs.build_os == matrix.filter || github.event.inputs.build_os == 'All')
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

      # step3: install node env
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux' && (github.event.inputs.build_os == matrix.filter || github.event.inputs.build_os == 'All')
        shell: bash
        run: |
          case "${{ matrix.format }}" in
            deb)
              sudo apt-get update
              sudo apt-get install --no-install-recommends -y binutils xz-utils
              ;;
            rpm)
              sudo apt-get update
              sudo apt-get install --no-install-recommends -y rpm
              ;;
            AppImage|snap)
              # AppImage and the default x64 Snap template use bundled packaging tools.
              echo "Using electron-builder's bundled packaging tools."
              ;;
          esac

      - name: Install FPM
        if: runner.os == 'Linux' && matrix.arch == 'arm64' && (matrix.format == 'deb' || matrix.format == 'rpm') && (github.event.inputs.build_os == matrix.filter || github.event.inputs.build_os == 'All')
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      # step3: yarn
      - name: Install dependencies
        if: github.event.inputs.build_os == matrix.filter || github.event.inputs.build_os == 'All'
        shell: bash
        run: |
          yarn config set ignore-engines true
          rm -rf node_modules dist_electron && yarn install --frozen-lockfile
          yarn global add xvfb-maybe
          if [[ "${{ matrix.format }}" == "zip" || "${{ matrix.format }}" == "7z" ]]; then
            echo "Target format is ${{ matrix.format }}, downloading all resources..."
            yarn run prepare:7za
          fi
          echo "Checking resources directory:"
          ls -alh ./resources/theme || echo "Theme directory not found"
          # check 7za.exe and theme dir
          if [[ -f "./resources/7za.exe" ]]; then
            echo "✅ 7za.exe exists"
          else
            echo "❌ 7za.exe does not exist"
          fi

      - name: Build & release app
        if: github.event.inputs.build_os == matrix.filter || github.event.inputs.build_os == 'All'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-11-arm" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK WIN_CSC_LINK CSC_KEY_PASSWORD
          fi
          if [[ "${{ matrix.os }}" == windows* ]]; then
            yarn run build:win ${{ matrix.format}} --${{ matrix.arch }} --publish never
          elif [[ "${{ matrix.os }}" == macos* ]]; then
            yarn run build:mac default --${{ matrix.arch }} --publish never
          elif [[ "${{ matrix.os }}" == ubuntu* ]]; then
            yarn run build:linux ${{ matrix.format}} --${{ matrix.arch }} --publish never
          else
            echo "Unsupported OS: ${{ matrix.os }}"
            exit 1
          fi
        env:
          USE_SYSTEM_FPM: ${{ runner.os == 'Linux' && matrix.arch == 'arm64' && (matrix.format == 'deb' || matrix.format == 'rpm') && 'true' || 'false' }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ELECTRON_SKIP_NOTARIZATION: ${{ secrets.ELECTRON_SKIP_NOTARIZATION }}
          XCODE_APP_LOADER_EMAIL: ${{ secrets.XCODE_APP_LOADER_EMAIL }}
          XCODE_APP_LOADER_PASSWORD: ${{ secrets.XCODE_APP_LOADER_PASSWORD }}
          XCODE_TEAM_ID: ${{ secrets.XCODE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          USE_HARD_LINKS: false

      - name: Validate expected build artifacts and metadata
        id: build-files
        if: github.event.inputs.build_os == matrix.filter || github.event.inputs.build_os == 'All'
        shell: bash
        run: |
          node scripts/release-manifest.js check-build ./dist_electron \
            --build "${{ matrix.filter }}" --github-output "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: github.event.inputs.build_os == matrix.filter || github.event.inputs.build_os == 'All'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filter }}-artifacts
          path: ${{ steps.build-files.outputs.files }}
          retention-days: 30
          if-no-files-found: 'error'

      - name: Upload yml artifacts
        if: steps.build-files.outputs.has_metadata == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filter }}-yml
          path: ${{ steps.build-files.outputs.metadata_files }}
          retention-days: 30
          if-no-files-found: 'error'

  combine-and-upload:
    name: Combine and Upload Release
    needs: build
    runs-on: ubuntu-latest
    # All branches/tags write the same bucket and latest/ keys. Hold the lock through
    # GitHub publication, versioned staging, compatibility copies and final metadata.
    concurrency:
      group: piclist-release-publication
      cancel-in-progress: false
    env:
      RELEASE_BUILD: ${{ github.event.inputs.build_os }}
      RELEASE_TAG: ${{ github.event.inputs.tag_name }}
      PUBLICATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PROMOTE_LATEST: ${{ github.event.inputs.publish_enabled == 'true' && github.event.inputs.build_os == 'All' && github.event.inputs.tag_name != 'preview' }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies
        shell: bash
        run: |
          yarn config set ignore-engines true
          rm -rf node_modules && yarn install --frozen-lockfile

      - name: Test release publication
        run: yarn test:release

      - name: Derive expected release artifacts and metadata
        id: expected
        run: node scripts/release-manifest.js plan --build "$RELEASE_BUILD" --github-output "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-artifacts'
          path: ./artifacts

      - name: Download YML Artifacts
        # Windows ZIP/7z and Snap builds intentionally have no updater YAML.
        if: steps.expected.outputs.has_metadata == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: '*-yml'
          path: ./yml-artifacts
          merge-multiple: false

      - name: Combine and deduplicate yml files
        run: |
          node scripts/combine-yml.cjs ./yml-artifacts ./dist_electron/combined --build "$RELEASE_BUILD"

      - name: Validate selected release manifest
        id: manifest
        shell: bash
        run: |
          args=()
          if [[ "$PROMOTE_LATEST" == 'true' ]]; then
            args+=(--promote-latest --release-tag "$RELEASE_TAG")
          fi
          node scripts/upload-to-s3.js validate ./artifacts ./dist_electron/combined \
            --build "$RELEASE_BUILD" --github-output "$GITHUB_OUTPUT" \
            --manifest-output ./verified-release-manifest.json "${args[@]}"

      - name: Generate Release Notes
        id: release-notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$PROMOTE_LATEST" == 'true' ]]; then
            publication_tag="$RELEASE_TAG"
          else
            publication_tag="build-$PUBLICATION_ID"
          fi
          # Exclude drafts and let Git select the nearest published ancestor.
          # A failed API request must fail the step, not imply a first release.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > published-release-tags.txt
          bash ./scripts/generate-release-notes.sh \
            --release-tag "$publication_tag" --source-commit "$GITHUB_SHA" \
            --published-tags-file ./published-release-tags.txt \
            --manifest ./verified-release-manifest.json --repository "$GITHUB_REPOSITORY"
          printf 'tag=%s\n' "$publication_tag" >> "$GITHUB_OUTPUT"

      # GitHub is the prerequisite publication backend. A failed GitHub release
      # fails this job and prevents both S3 staging and latest promotion.
      # Draft/prerelease flags do not protect an existing release with the same
      # tag. Isolate every non-promoting run so partial metadata cannot replace
      # assets on a complete public update channel, even if that tag was requested.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: ${{ steps.release-notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ env.PROMOTE_LATEST != 'true' }}
          prerelease: ${{ env.PROMOTE_LATEST != 'true' }}
          make_latest: ${{ env.PROMOTE_LATEST == 'true' }}
          body_path: ./release-notes.md
          name: ${{ github.event.inputs.tag_name }}
          fail_on_unmatched_files: true
          files: ${{ steps.manifest.outputs.files }}

      - name: Stage and verify versioned S3 release
        if: github.event.inputs.publish_enabled == 'true'
        run: |
          node scripts/upload-to-s3.js stage ./artifacts ./dist_electron/combined \
            --build "$RELEASE_BUILD" --publication-id "$PUBLICATION_ID"
        env:
          R2_SECRET_ID: ${{ secrets.R2_SECRET_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Promote verified S3 release to latest
        if: env.PROMOTE_LATEST == 'true'
        run: |
          node scripts/upload-to-s3.js promote ./artifacts ./dist_electron/combined \
            --build "$RELEASE_BUILD" --publication-id "$PUBLICATION_ID" --release-tag "$RELEASE_TAG"
        env:
          R2_SECRET_ID: ${{ secrets.R2_SECRET_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
