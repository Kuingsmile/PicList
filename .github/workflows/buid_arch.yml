name: Build with architecture

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release label/tag; non-promoting builds use an isolated run-specific draft tag'
        required: false
        default: 'preview'
        type: string
      publish_enabled:
        description: 'Enable S3 staging? Stable All builds also publish GitHub and promote latest.'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'
      build_os:
        description: 'Build OS'
        required: true
        default: 'All'
        type: choice
        options:
          - windows-latest-x64-zip
          - windows-latest-x64-7z
          - windows-latest-x64-nsis
          - windows-11-arm-arm64-zip
          - windows-11-arm-arm64-7z
          - windows-11-arm-arm64-nsis
          - macos-15-intel-x64-dmg
          - macos-latest-arm64-dmg
          - ubuntu-latest-x64-AppImage
          - ubuntu-latest-x64-deb
          - ubuntu-latest-x64-snap
          - ubuntu-latest-x64-rpm
          - ubuntu-24.04-arm-arm64-AppImage
          - ubuntu-24.04-arm-arm64-deb
          - ubuntu-24.04-arm-arm64-rpm
          - All
permissions:
  contents: write

env:
  ELECTRON_OUTPUT_PATH: ./dist_electron
  CSC_LINK: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
  CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
  USE_HARD_LINKS: false

jobs:
  plan:
    name: Select build runners
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Plan selected OS and architecture groups
        id: plan
        env:
          RELEASE_BUILD: ${{ inputs.build_os }}
        run: node scripts/release-manifest.js plan --build "$RELEASE_BUILD" --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Filter before allocating build runners; All uses six OS/architecture jobs.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Build on ${{ matrix.os }} for ${{ matrix.arch }}
    steps:
      - name: Set up git config
        run: |
          git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux' && (contains(matrix.formats, 'deb') || contains(matrix.formats, 'rpm'))
        shell: bash
        env:
          BUILD_FORMATS: ${{ join(matrix.formats, ' ') }}
        run: |
          packages=()
          for format in $BUILD_FORMATS; do
            case "$format" in
              deb) packages+=(binutils xz-utils) ;;
              rpm) packages+=(rpm) ;;
            esac
          done
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            packages+=(ruby ruby-dev build-essential)
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "${packages[@]}"
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            sudo gem install --no-document fpm
          fi

      - name: Install dependencies
        shell: bash
        run: yarn install --frozen-lockfile --ignore-engines --non-interactive

      - name: Prepare portable resources
        if: contains(matrix.formats, 'zip') || contains(matrix.formats, '7z')
        run: yarn run prepare:7za

      - name: Test packaging hooks
        run: yarn test:packaging

      - name: Compile app once for this OS and architecture
        run: yarn build:app

      - name: Package and validate selected formats
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" == "windows-11-arm" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK WIN_CSC_LINK CSC_KEY_PASSWORD
          fi
          for format in $BUILD_FORMATS; do
            # The application is already compiled. Package each target separately
            # and snapshot its YAML before another target writes the same filename.
            case "${{ runner.os }}" in
              Windows) yarn electron-builder --win "$format" --${{ matrix.arch }} --publish never ;;
              macOS) yarn electron-builder --mac default --${{ matrix.arch }} --publish never ;;
              Linux) yarn electron-builder --linux "$format" --${{ matrix.arch }} --publish never ;;
              *) exit 1 ;;
            esac
            node scripts/release-manifest.js stage-build ./dist_electron \
              --build "${{ matrix.os }}-${{ matrix.arch }}-$format" --stage-dir ./release
          done
        env:
          BUILD_FORMATS: ${{ join(matrix.formats, ' ') }}
          USE_SYSTEM_FPM: ${{ runner.os == 'Linux' && matrix.arch == 'arm64' && (contains(matrix.formats, 'deb') || contains(matrix.formats, 'rpm')) && 'true' || 'false' }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ELECTRON_SKIP_NOTARIZATION: ${{ secrets.ELECTRON_SKIP_NOTARIZATION }}
          XCODE_APP_LOADER_EMAIL: ${{ secrets.XCODE_APP_LOADER_EMAIL }}
          XCODE_APP_LOADER_PASSWORD: ${{ secrets.XCODE_APP_LOADER_PASSWORD }}
          XCODE_TEAM_ID: ${{ secrets.XCODE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          USE_HARD_LINKS: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}-artifacts
          path: ./release/artifacts/
          retention-days: 30
          if-no-files-found: 'error'

      - name: Upload yml artifacts
        if: matrix.has_metadata
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}-yml
          path: ./release/yml/
          retention-days: 30
          if-no-files-found: 'error'

  combine-and-upload:
    name: Combine and Upload Release
    needs: build
    runs-on: ubuntu-latest
    # All branches/tags write the same bucket and latest/ keys. Hold the lock through
    # GitHub publication, versioned staging, compatibility copies and final metadata.
    concurrency:
      group: piclist-release-publication
      cancel-in-progress: false
    env:
      RELEASE_BUILD: ${{ github.event.inputs.build_os }}
      RELEASE_TAG: ${{ github.event.inputs.tag_name }}
      PUBLICATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PROMOTE_LATEST: ${{ github.event.inputs.publish_enabled == 'true' && github.event.inputs.build_os == 'All' && github.event.inputs.tag_name != 'preview' }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install release utility dependencies without lifecycle scripts
        shell: bash
        run: |
          node scripts/prepare-release-dependencies.js "$RUNNER_TEMP/release-tools"
          yarn --cwd "$RUNNER_TEMP/release-tools" install \
            --modules-folder "$GITHUB_WORKSPACE/node_modules" \
            --frozen-lockfile --ignore-scripts --ignore-engines --non-interactive

      - name: Test release publication
        run: yarn test:release

      - name: Derive expected release artifacts and metadata
        id: expected
        run: node scripts/release-manifest.js plan --build "$RELEASE_BUILD" --github-output "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-artifacts'
          path: ./artifacts
          merge-multiple: true

      - name: Download YML Artifacts
        # Windows ZIP/7z and Snap builds intentionally have no updater YAML.
        if: steps.expected.outputs.has_metadata == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: '*-yml'
          path: ./yml-artifacts
          merge-multiple: true

      - name: Combine and deduplicate yml files
        run: |
          node scripts/combine-yml.cjs ./yml-artifacts ./dist_electron/combined --build "$RELEASE_BUILD"

      - name: Validate selected release manifest
        id: manifest
        shell: bash
        run: |
          args=()
          if [[ "$PROMOTE_LATEST" == 'true' ]]; then
            args+=(--promote-latest --release-tag "$RELEASE_TAG")
          fi
          node scripts/upload-to-s3.js validate ./artifacts ./dist_electron/combined \
            --build "$RELEASE_BUILD" --github-output "$GITHUB_OUTPUT" \
            --manifest-output ./verified-release-manifest.json "${args[@]}"

      - name: Generate Release Notes
        id: release-notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$PROMOTE_LATEST" == 'true' ]]; then
            publication_tag="$RELEASE_TAG"
          else
            publication_tag="build-$PUBLICATION_ID"
          fi
          # Exclude drafts and let Git select the nearest published ancestor.
          # A failed API request must fail the step, not imply a first release.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > published-release-tags.txt
          bash ./scripts/generate-release-notes.sh \
            --release-tag "$publication_tag" --source-commit "$GITHUB_SHA" \
            --published-tags-file ./published-release-tags.txt \
            --manifest ./verified-release-manifest.json --repository "$GITHUB_REPOSITORY"
          printf 'tag=%s\n' "$publication_tag" >> "$GITHUB_OUTPUT"

      # GitHub is the prerequisite publication backend. A failed GitHub release
      # fails this job and prevents both S3 staging and latest promotion.
      # Draft/prerelease flags do not protect an existing release with the same
      # tag. Isolate every non-promoting run so partial metadata cannot replace
      # assets on a complete public update channel, even if that tag was requested.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: ${{ steps.release-notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ env.PROMOTE_LATEST != 'true' }}
          prerelease: ${{ env.PROMOTE_LATEST != 'true' }}
          make_latest: ${{ env.PROMOTE_LATEST == 'true' }}
          body_path: ./release-notes.md
          name: ${{ github.event.inputs.tag_name }}
          fail_on_unmatched_files: true
          files: ${{ steps.manifest.outputs.files }}

      - name: Stage and verify versioned S3 release
        if: github.event.inputs.publish_enabled == 'true'
        run: |
          node scripts/upload-to-s3.js stage ./artifacts ./dist_electron/combined \
            --build "$RELEASE_BUILD" --publication-id "$PUBLICATION_ID"
        env:
          R2_SECRET_ID: ${{ secrets.R2_SECRET_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Promote verified S3 release to latest
        if: env.PROMOTE_LATEST == 'true'
        run: |
          node scripts/upload-to-s3.js promote ./artifacts ./dist_electron/combined \
            --build "$RELEASE_BUILD" --publication-id "$PUBLICATION_ID" --release-tag "$RELEASE_TAG"
        env:
          R2_SECRET_ID: ${{ secrets.R2_SECRET_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
