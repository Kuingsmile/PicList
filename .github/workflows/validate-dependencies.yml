name: Validate native dependencies
run-name: Native dependencies (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Optional PicList-Core commit to validate alongside the published dependency'
        required: false
        type: string
  push:
    branches:
      - 'codex/pnpm-sharp-*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ELECTRON_SKIP_NOTARIZATION: 'true'
  USE_HARD_LINKS: 'false'
  HUSKY: '0'

jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            platform: win
            formats: 'nsis zip 7z'
          - os: windows-11-arm
            arch: arm64
            platform: win
            formats: 'nsis zip 7z'
          - os: macos-15-intel
            arch: x64
            platform: mac
            formats: default
          - os: macos-latest
            arch: arm64
            platform: mac
            formats: default
          - os: ubuntu-24.04
            arch: x64
            platform: linux
            formats: 'AppImage deb rpm snap'
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux
            formats: 'AppImage deb rpm'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils xz-utils rpm xvfb fonts-dejavu-core
          if [[ '${{ matrix.arch }}' == arm64 ]]; then
            sudo apt-get install --no-install-recommends -y ruby ruby-dev build-essential
            sudo gem install --no-document fpm
          fi

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and lint
        run: |
          pnpm typecheck
          pnpm lint

      # Keep generated fixtures and executable checks outside the repository.
      - name: Prepare image-processing checks in runner temporary storage
        run: |
          cat > "$RUNNER_TEMP/sharp-smoke.cjs" <<'JS'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const path = require('node:path')
          const { createRequire } = require('node:module')
          const { pathToFileURL } = require('node:url')
          process.on('uncaughtException', error => { console.error(error.message); process.exit(1) })
          const root = process.env.CORE_ROOT || process.env.APP_ROOT || process.cwd()
          const appRequire = createRequire(path.join(root, 'package.json'))
          const coreEntry = process.env.CORE_ROOT ? path.join(root, 'dist/index.js') : appRequire.resolve('piclist')
          const coreRequire = createRequire(coreEntry)
          console.log('Loading Sharp')
          const sharp = coreRequire('sharp')
          async function check() {
            console.log('Checking core imports and image encoders')
            assert.equal(sharp.versions.sharp, '0.35.5')
            assert.ok(Number(process.versions.napi) >= 9)
            assert.equal(Boolean(sharp.versions.emscripten), process.platform === 'linux' && Boolean(process.versions.electron))
            const { PicGoUtils } = await import(pathToFileURL(coreEntry).href)
            const logger = { error() { throw new Error('Core image processing reported an error') } }
            const input = await sharp({ create: { width: 128, height: 80, channels: 4, background: '#487abd' } }).png().toBuffer()
            for (const format of ['jpg', 'png', 'webp', 'avif', 'tif', 'gif', 'heif']) {
              assert.ok(PicGoUtils.getAvailableConvertFormats().includes(format), `Missing encoder: ${format}`)
              const output = await PicGoUtils.imageCompress(input, {
                isConvert: true, convertFormat: format, quality: 80,
                isReSize: true, reSizeWidth: 32, reSizeHeight: 20,
              }, 'png', logger)
              const metadata = await sharp(output).metadata()
              assert.equal(metadata.width, 32)
              assert.equal(metadata.height, 20)
            }
            const svg = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="40"><rect width="64" height="40" fill="red"/></svg>')
            console.log('Checking SVG and watermark rendering')
            const svgOutput = await PicGoUtils.imageCompress(svg, { isConvert: true, convertFormat: 'png' }, 'svg', logger)
            assert.equal((await sharp(svgOutput).metadata()).format, 'png')
            const textSvg = Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="70"><rect width="240" height="70" fill="white"/><text x="5" y="48" font-family="sans-serif" font-size="36" fill="black">PicList</text></svg>')
            const renderedText = await sharp(textSvg).removeAlpha().raw().toBuffer({ resolveWithObject: true })
            let textPixels = 0
            for (let i = 0; i < renderedText.data.length; i += renderedText.info.channels) {
              if (renderedText.data[i] < 128) textPixels++
            }
            assert.ok(textPixels > 100, `SVG text is missing: ${textPixels} dark pixels`)
            assert.equal((await sharp(textSvg).metadata()).size, textSvg.length)
            const textFile = path.join(process.env.RUNNER_TEMP, 'svg-text-without-extension')
            fs.writeFileSync(textFile, textSvg)
            const textInputs = [textFile, require('node:zlib').gzipSync(textSvg)]
            for (const textInput of textInputs) {
              assert.equal((await sharp(textInput).metadata()).format, 'svg')
              assert.equal((await sharp(textInput).stats()).channels[0].min, 0)
            }
            const textStream = sharp().png()
            require('node:stream').Readable.from([textSvg]).pipe(textStream)
            assert.equal((await sharp(await textStream.toBuffer()).stats()).channels[0].min, 0)
            assert.equal((await sharp(textSvg, { density: 144 }).png().toBuffer({ resolveWithObject: true })).info.width, 480)
            const textComposite = await sharp({ create: { width: 240, height: 70, channels: 4, background: 'white' } })
              .composite([{ input: textSvg }]).png().toBuffer()
            assert.equal((await sharp(textComposite).stats()).channels[0].min, 0)
            const marked = await PicGoUtils.AddWatermark(input, 'image', '')
            assert.equal((await sharp(marked).metadata()).width, 128)
            assert.notDeepEqual(await sharp(marked).raw().toBuffer(), await sharp(input).raw().toBuffer())
            const fonts = ['C:/Windows/Fonts/arial.ttf', '/System/Library/Fonts/Supplemental/Arial.ttf', '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf']
            const font = fonts.find(file => fs.existsSync(file))
            assert.ok(font, 'A font is required to check text watermarks')
            const text = await PicGoUtils.AddWatermark(input, 'text', font, true, 30, 'PicList')
            assert.equal((await sharp(text).metadata()).width, 128)
            const frames = Buffer.alloc(64 * 80 * 4)
            console.log('Checking animation, metadata and concurrent processing')
            for (let i = 0; i < frames.length; i += 4) {
              frames[i] = i < 64 * 40 * 4 ? 255 : 0
              frames[i + 2] = i < 64 * 40 * 4 ? 0 : 255
              frames[i + 3] = 255
            }
            const animated = await sharp(frames, { raw: { width: 64, height: 80, pageHeight: 40, channels: 4 } }).webp({ delay: [40, 60], loop: 0 }).toBuffer()
            assert.equal((await sharp(animated, { animated: true }).metadata()).pages, 2)
            const animatedOutput = await PicGoUtils.imageCompress(animated, { isConvert: true, convertFormat: 'webp', quality: 80 }, 'webp', logger)
            assert.equal((await sharp(animatedOutput, { animated: true }).metadata()).pages, 2)
            const exif = await sharp(input).withExif({ IFD0: { Copyright: 'PicList CI fixture' } }).jpeg().toBuffer()
            const stripped = await PicGoUtils.removeExif(exif, 'jpg')
            assert.equal((await sharp(stripped).metadata()).exif, undefined)
            await Promise.all(Array.from({ length: 12 }, () => sharp(svg).resize(16, 10).png().toBuffer()))
            const result = { status: 'passed', platform: process.platform, arch: process.arch, node: process.versions.node, electron: process.versions.electron, sharp: sharp.versions.sharp, vips: sharp.versions.vips, wasm: Boolean(sharp.versions.emscripten), packaged: Boolean(process.env.APP_ROOT) }
            if (process.env.SMOKE_RESULT) fs.writeFileSync(process.env.SMOKE_RESULT, JSON.stringify(result))
            console.log(JSON.stringify(result))
          }
          const electron = process.versions.electron && !process.env.ELECTRON_RUN_AS_NODE ? require('electron') : undefined
          if (electron) {
            console.log('Waiting for Electron app readiness')
            electron.app.setPath('userData', path.join(process.env.RUNNER_TEMP, 'piclist-validation-userdata'))
            electron.app.disableHardwareAcceleration()
            electron.app.whenReady().then(check).then(() => electron.app.exit(0)).catch(error => { console.error(error.message); electron.app.exit(1) })
          } else {
            check().catch(error => { console.error(error.message); process.exitCode = 1 })
          }
          JS

      - name: Check published core with Sharp in Node
        timeout-minutes: 3
        run: |
          export SMOKE_RESULT="$RUNNER_TEMP/node-smoke-result.json"
          node "$RUNNER_TEMP/sharp-smoke.cjs"
          node -e "require('node:assert/strict').equal(JSON.parse(require('node:fs').readFileSync(process.env.SMOKE_RESULT, 'utf8')).status, 'passed')"

      - name: Check Sharp in the Electron main process
        id: electron-smoke
        # Finish packaging even when a native crash occurs, then fail the gate below.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          export SMOKE_RESULT="$RUNNER_TEMP/electron-smoke-result.json"
          electron="$(node -p "require('electron')")"
          if [[ '${{ runner.os }}' == Linux ]]; then
            xvfb-run -a "$electron" --no-sandbox "$RUNNER_TEMP/sharp-smoke.cjs"
          else
            "$electron" "$RUNNER_TEMP/sharp-smoke.cjs"
          fi
          # A native process can terminate early with exit 0; require completed checks.
          node -e "require('node:assert/strict').equal(JSON.parse(require('node:fs').readFileSync(process.env.SMOKE_RESULT, 'utf8')).status, 'passed')"

      - name: Compile application
        run: pnpm build:app

      - name: Prepare portable resources
        if: runner.os == 'Windows'
        run: pnpm prepare:7za

      - name: Package all platform formats
        env:
          USE_SYSTEM_FPM: ${{ runner.os == 'Linux' && matrix.arch == 'arm64' && 'true' || 'false' }}
        run: pnpm exec electron-builder --${{ matrix.platform }} ${{ matrix.formats }} --${{ matrix.arch }} --publish never

      - name: Check Sharp from the packaged ASAR and bundled npm
        id: packaged-smoke
        continue-on-error: true
        timeout-minutes: 3
        run: |
          export SMOKE_RESULT="$RUNNER_TEMP/packaged-smoke-result.json"
          case '${{ runner.os }}-${{ matrix.arch }}' in
            Windows-x64) app_dir='dist_electron/win-unpacked'; executable="$app_dir/PicList.exe"; resources="$app_dir/resources" ;;
            Windows-arm64) app_dir='dist_electron/win-arm64-unpacked'; executable="$app_dir/PicList.exe"; resources="$app_dir/resources" ;;
            macOS-x64) app_dir='dist_electron/mac/PicList.app/Contents'; executable="$app_dir/MacOS/PicList"; resources="$app_dir/Resources" ;;
            macOS-arm64) app_dir='dist_electron/mac-arm64/PicList.app/Contents'; executable="$app_dir/MacOS/PicList"; resources="$app_dir/Resources" ;;
            Linux-x64) app_dir='dist_electron/linux-unpacked'; executable="$app_dir/PicList"; resources="$app_dir/resources" ;;
            Linux-arm64) app_dir='dist_electron/linux-arm64-unpacked'; executable="$app_dir/PicList"; resources="$app_dir/resources" ;;
          esac
          export APP_ROOT="$(node -e "console.log(require('node:path').resolve(process.argv[1]))" "$resources/app.asar")"
          electron="$(node -p "require('electron')")"
          if [[ '${{ runner.os }}' == Linux ]]; then
            xvfb-run -a "$electron" --no-sandbox "$RUNNER_TEMP/sharp-smoke.cjs"
          else
            "$electron" "$RUNNER_TEMP/sharp-smoke.cjs"
          fi
          node -e "require('node:assert/strict').equal(JSON.parse(require('node:fs').readFileSync(process.env.SMOKE_RESULT, 'utf8')).status, 'passed')"
          ELECTRON_RUN_AS_NODE=1 "$executable" "$resources/plugin-runtime/npm/bin/npm-cli.js" --version
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml

      - name: Checkout optional core candidate
        if: inputs.core_ref != ''
        uses: actions/checkout@v7
        with:
          repository: Kuingsmile/piclist-core
          ref: ${{ inputs.core_ref }}
          path: core-candidate
          persist-credentials: false

      - name: Build and check optional core candidate
        if: inputs.core_ref != ''
        run: |
          pnpm --dir core-candidate install --frozen-lockfile
          pnpm --dir core-candidate typecheck
          pnpm --dir core-candidate build
          CORE_ROOT="$GITHUB_WORKSPACE/core-candidate" APP_ROOT='' node "$RUNNER_TEMP/sharp-smoke.cjs"

      - name: Require successful Electron image processing
        if: always() && (steps.electron-smoke.outcome == 'failure' || steps.packaged-smoke.outcome == 'failure')
        run: |
          echo 'Electron image processing failed; packaged artifacts are not release-ready.' >&2
          exit 1

  linux-glib-comparison:
    name: Linux ARM64 / Sharp ${{ matrix.sharp }} comparison
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sharp: ['0.34.4', '0.35.5']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Install isolated comparison dependencies
        env:
          SHARP_VERSION: ${{ matrix.sharp }}
          # Match the Electron version in pnpm-lock.yaml for the upgrade comparison.
          ELECTRON_VERSION: '39.8.10'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb
          export GLIB_ROOT="$RUNNER_TEMP/glib-comparison"
          mkdir -p "$GLIB_ROOT"
          node -e "require('node:fs').writeFileSync(process.env.GLIB_ROOT + '/package.json', JSON.stringify({private: true, dependencies: {sharp: process.env.SHARP_VERSION, electron: process.env.ELECTRON_VERSION}}))"
          printf 'allowBuilds:\n  electron: true\n  sharp: true\n' > "$GLIB_ROOT/pnpm-workspace.yaml"
          pnpm --dir "$GLIB_ROOT" install
      - name: Compare Node and Electron load timing
        run: |
          export GLIB_ROOT="$RUNNER_TEMP/glib-comparison"
          cat > "$GLIB_ROOT/probe.cjs" <<'JS'
          const assert = require('node:assert/strict')
          const electron = process.versions.electron && !process.env.ELECTRON_RUN_AS_NODE ? require('electron') : undefined
          let sharp
          function load() {
            console.log('Loading Sharp')
            sharp = require('sharp')
          }
          if (process.env.LOAD_TIMING !== 'after-ready') load()
          async function check() {
            if (!sharp) load()
            console.log('Encoding PNG')
            const input = await sharp({ create: { width: 32, height: 20, channels: 4, background: 'red' } }).png().toBuffer()
            console.log('Decoding and resizing PNG')
            assert.equal((await sharp(input).metadata()).width, 32)
            await sharp(input).resize(16, 10).webp().toBuffer()
            console.log('Rasterizing SVG')
            await sharp(Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="20"><rect width="32" height="20" fill="red"/></svg>')).png().toBuffer()
            if (process.env.PROBE_RESULT) require('node:fs').writeFileSync(process.env.PROBE_RESULT, 'passed')
            console.log(JSON.stringify({ status: 'passed', sharp: sharp.versions.sharp, electron: process.versions.electron, arch: process.arch, timing: process.env.LOAD_TIMING }))
          }
          if (electron) {
            console.log('Waiting for Electron app readiness')
            electron.app.disableHardwareAcceleration()
            electron.app.whenReady().then(check).then(() => electron.app.exit(0)).catch(error => { console.error(error.message); electron.app.exit(1) })
          } else {
            check().catch(error => { console.error(error.message); process.exitCode = 1 })
          }
          JS
          cd "$GLIB_ROOT"
          node probe.cjs
          electron="$(node -p "require('electron')")"
          for timing in before-ready after-ready; do
            set +e
            PROBE_RESULT="$RUNNER_TEMP/glib-$timing.passed" LOAD_TIMING="$timing" timeout 60s xvfb-run -a "$electron" --no-sandbox probe.cjs > "$RUNNER_TEMP/glib-$timing.log" 2>&1
            result=$?
            set -e
            completed=no
            if [[ -f "$RUNNER_TEMP/glib-$timing.passed" ]]; then completed=yes; fi
            echo "Sharp ${{ matrix.sharp }} / $timing: exit $result, completed=$completed" | tee -a "$GITHUB_STEP_SUMMARY"
            head -n 12 "$RUNNER_TEMP/glib-$timing.log"
            grep -E 'Encoding|Decoding|Rasterizing|"status"|Trace/breakpoint|Error' "$RUNNER_TEMP/glib-$timing.log" | tail -n 10 || true
          done
          # Informational baseline only; the native matrix above remains the release gate.

  release-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Validate frozen installation for release utilities without hooks
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/release-manifest.js plan --build All
          node -e "Promise.all(['@aws-sdk/client-s3', '@aws-sdk/lib-storage', '@smithy/node-http-handler', 'dotenv', 'js-yaml', 'semver', 'yaml'].map(name => import(name))).then(() => console.log('Release utility imports passed'))"
